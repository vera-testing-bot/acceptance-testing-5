[project]
name = "acceptance-shard-app"
version = "0.1.0"
description = "Seed project for a Vera acceptance shard repo."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shard_app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
